<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <article>
      <!-- thumbnail -->
      <a href="#"><img class="thumbnail" src="assets/images/illustration-article.svg" alt=""></a>

      <!-- tags -->
      <ul class="tags">
        <li class="tag learning-tag">Learning</li>
      </ul>

      <!-- publishing date -->
      <time datetime="2023-12-21">Published 21 Dec 2023</time>

      <!-- title -->
      <h2 class="title"><a href="#">HTML & CSS foundations</a></h2>

      <!-- description -->
      <p class="description">
        These languages are the backbone of every website, defining structure, content, and presentation.
      </p>

      <!-- author -->
      <a class="author" href="#">
        <img src="assets/images/image-avatar.webp" alt="">
        <p>Greg Hooper</p>
      </a>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Seviolune</a>.
  </footer>
</body>
</html>
